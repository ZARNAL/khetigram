<style>

#mobileBottomNav{position:fixed;z-index:30;bottom:0;left:0;right:0;background:rgba(255,255,255,.88);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid #e7ece7;padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px}.nav-btn{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:65px;color:#778078;font-size:10px;font-weight:700;padding:3px 8px;border-radius:12px}.nav-btn.active{color:#218448;background:#eef7f0}.nav-icon{font-size:18px;line-height:1}
:focus-visible{outline:3px solid #5ca77a55;outline-offset:2px}

<body>
<header><div class="topbar">
<div class="brand"><div class="brand-icon">🌾</div><div><h1>ખેતીગ્રામ <span style="color:#218448">· બજાર ભાવ</span></h1><small id="activeDateSubtitle">આજના ભાવ</small><small id="dataStatusBadge" style="display:inline-block;margin-top:3px;padding:2px 6px;border-radius:99px;background:#e8f5eb;color:#267342;font-size:9px">લાઈવ</small></div></div>
<div class="header-actions"><div class="unit-toggle"><button id="unitMannBtn" class="active" type="button">મણ</button><button id="unitQuintalBtn" type="button">ક્વિન્ટલ</button></div><button id="refreshDataBtn" class="icon-btn" type="button" title="ફરી ભાવ લાવો"><svg id="refreshIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 7v5h-5M4 17v-5h5M5.6 9A7 7 0 0 1 18 5.5L20 7M4 17l2 1.5A7 7 0 0 0 18.4 15"/></svg></button></div>
</div></header>
<main>
<section class="panel selector">
<div class="dates"><button data-mode="live" class="date-pill active">આજ</button><button data-mode="yesterday" class="date-pill">ગઈકાલ</button><button data-mode="two_days_ago" class="date-pill">૨ દિવસ</button><div class="date-calendar"><span style="font-size:12px">📅</span><input id="specificDateInput" type="date" aria-label="તારીખ પસંદ કરો"></div></div>
<div class="crop-search"><span class="search-icon">⌕</span><input id="cropSearchInput" type="search" placeholder="પાક શોધો — જેમ કે મગફળી, કપાસ..." aria-label="પાક શોધો"></div>
<div id="categoryTabs"></div><div id="visualCropGrid"></div>
<div class="filter-row"><label>તમારા વિસ્તારના ભાવ જુઓ</label><button id="toggleMoreFiltersBtn" class="filter-toggle" type="button">📍 જિલ્લો / યાર્ડ <span id="activeFilterDot" class="hidden">●</span></button></div>
<div id="moreFiltersDrawer" class="hidden filter-drawer"><select id="districtFilter" aria-label="જિલ્લો"><option value="">બધા જિલ્લા</option></select><select id="marketFilter" aria-label="માર્કેટ યાર્ડ"><option value="">બધા યાર્ડ</option></select></div>
<button id="resetFiltersBtn" class="hidden" type="button" style="border:0;background:#eef4ed;color:#2c693e;border-radius:999px;padding:6px 10px;font-size:10px;font-weight:800;margin-top:6px">ફિલ્ટર દૂર કરો ✕</button>
</section>
<div id="alertBanner" class="hidden"><strong><span id="alertTitle"></span></strong> <span id="alertMessage"></span><button onclick="document.getElementById('alertBanner').classList.add('hidden')" style="float:right;border:0;background:none">✕</button></div>
<div id="loadingState" class="panel"><div class="loader"></div><h3>બજારના ભાવ લાવી રહ્યા છીએ...</h3><p style="color:#7a847b;font-size:11px;margin:5px 0 0">થોડી ક્ષણ રાહ જુઓ</p></div>
<div id="dashboardContent" class="hidden">
<div id="farmerDashboardView">
<div id="selectedCropHeroBanner" class="hidden"><div><span id="selectedCropHeroIcon">🌾</span><h3 id="selectedCropHeroTitle">પાક ભાવ</h3></div><button onclick="clearSelectedCrop()">બધા પાક જુઓ ✕</button></div>
<div class="summary-head"><div><h2>માર્કેટ ભાવ</h2><p id="tableSummaryText">ભાવ ઉપલબ્ધ છે</p></div><div class="summary-actions"><button id="speakSummaryBtn" type="button">🔊 સાંભળો</button><select id="simpleSortSelect" aria-label="ભાવ ગોઠવો"><option value="modal_desc">ઊંચા ભાવ પહેલા</option><option value="modal_asc">નીચા ભાવ પહેલા</option><option value="market_asc">યાર્ડ પ્રમાણે</option></select></div></div>
<div id="farmerCardsGrid"></div><div id="emptyTableState" class="hidden"><div style="font-size:28px">🌱</div><h4>ભાવ મળ્યા નથી</h4><p>બીજો પાક અથવા તારીખ પસંદ કરો.</p></div>
<div class="panel" style="padding:9px;display:flex;justify-content:space-between;align-items:center;gap:6px"><span style="font-size:10px;color:#7a847b;font-weight:700">વધુ ભાવ</span><div id="paginationControls"></div></div>
</div>
<div id="khetigramAppView" class="hidden">
<div class="panel"><div class="yard-search"><input type="search" id="kgSearchInput" placeholder="માર્કેટ યાર્ડ શોધો..." aria-label="યાર્ડ શોધો"><button id="kgBackToYardsBtn" class="hidden">‹ બધા યાર્ડ</button></div><div id="kgRegionTabs"><button data-region="ALL" class="kg-region-pill">બધા</button><button data-region="FAV" class="kg-region-pill">⭐ મનપસંદ</button><button data-region="Saurashtra" class="kg-region-pill">સૌરાષ્ટ્ર</button><button data-region="North" class="kg-region-pill">ઉત્તર</button><button data-region="Central" class="kg-region-pill">મધ્ય</button><button data-region="South" class="kg-region-pill">દક્ષિણ</button><button data-region="Kutch" class="kg-region-pill">કચ્છ</button></div></div>
<div id="kgYardDirectoryScreen"></div>
<div id="kgYardDetailScreen" class="hidden"><div class="p-4" style="display:flex;justify-content:space-between;align-items:center"><div style="min-width:0"><h3 id="kgSelectedYardTitle" style="margin:0;font-size:14px;font-weight:800"></h3><p id="kgSelectedYardMeta" style="font-size:10px;color:#7a847b;margin:3px 0"></p></div><div style="display:flex;gap:4px"><button id="kgToggleFavDetailBtn" type="button" style="border:0;background:#f1f4f1;border-radius:12px;padding:7px">☆</button><button id="kgBackToYardsBtn" type="button" style="border:0;background:#edf5ee;color:#287343;border-radius:12px;padding:7px;font-size:10px;font-weight:800">‹ પાછા</button></div></div><div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left">પાક</th><th style="text-align:right">ઓછો</th><th style="text-align:right">સરેરાશ</th><th style="text-align:right">ઊંચો</th></tr></thead><tbody id="kgYardRatesTbody"></tbody></table></div><div class="p-4" style="display:flex;gap:6px;flex-wrap:wrap"><button id="kgSpeakYardBtn" type="button" style="border:0;border-radius:999px;padding:8px 12px;background:#e8f2ff;color:#1469b2;font-size:11px;font-weight:800">🔊 ભાવ સાંભળો</button><button id="kgShareWhatsAppBtn" type="button" style="border:0;border-radius:999px;padding:8px 12px;background:#e8f5eb;color:#247540;font-size:11px;font-weight:800">WhatsApp મોકલો</button><button id="kgBottomBackBtn" type="button" style="border:0;border-radius:999px;padding:8px 12px;background:#f0f3ef;font-size:11px;font-weight:800">પાછા</button></div></div>
</div>
</div></main>
<nav id="mobileBottomNav"><button id="mobileTabCardsBtn" class="nav-btn active" type="button"><span class="nav-icon">🌾</span><span>પાકના ભાવ</span></button><button id="mobileTabYardsBtn" class="nav-btn" type="button"><span class="nav-icon">🏪</span><span>યાર્ડ</span></button><button id="mobileTabSpeakBtn" class="nav-btn" type="button"><span class="nav-icon">🔊</span><span>ભાવ સાંભળો</span></button></nav>
<script>

            { id: 'શાકભાજી', gu: 'શાકભાજી', icon: '🥔' },
            { id: 'પાંદડાવાળી શાકભાજી', gu: 'પાંદડાવાળી શાકભાજી', icon: '🥬' },

        function getGujaratiName(text) {
            if (!text) return '';
            const lower = text.toLowerCase().trim();
            if (EN_TO_GU[lower]) return EN_TO_GU[lower];
            for (const [key, gu] of Object.entries(EN_TO_GU)) {
                if (lower.includes(key)) return gu;
            }
            return text;
        }

        function getCropIcon(commodity) {
            const lower = (commodity || '').toLowerCase();
            const match = CROP_DICTIONARY.find(c => c.keywords.some(k => lower.includes(k)));

        }

        function speakGujarati(text) {
            if (!('speechSynthesis' in window)) {
                showBanner('માહિતી:', 'તમારા મોબાઈલમાં અવાજની સુવિધા ઉપલબ્ધ નથી.');
                return;
            }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            const voices = window.speechSynthesis.getVoices();
            const guVoice = voices.find(v => v.lang.includes('gu')) || voices.find(v => v.lang.includes('hi')) || voices.find(v => v.lang.includes('IN'));
            if (guVoice) utterance.voice = guVoice;
            utterance.lang = guVoice ? guVoice.lang : 'gu-IN';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

function getCsvCropList() {
            const unique = [...new Set((state.rawRecords || []).map(r => r.commodity).filter(Boolean))];
            return unique.map(commodity => {
                const lower = commodity.toLowerCase();
                const match = CROP_DICTIONARY.find(c => c.keywords.some(k => lower.includes(k)));
                return {
                    id: 'CSV:' + commodity,
                    commodity,
                    gu: getGujaratiName(commodity),
                    category: match ? match.category : 'અન્ય પાક',
                    icon: match ? match.icon : '🌾',
                    keywords: [commodity.toLowerCase()]
                };
            }).sort((a,b) => a.gu.localeCompare(b.gu, 'gu'));
        }

        function renderVisualCropButtons() {
            const csvCrops = getCsvCropList();
            const categories = [...new Set(csvCrops.map(c => c.category))];
            const categoryMeta = CROP_CATEGORIES.filter(c => c.id !== 'ALL');
            const dynamicCategories = categories.map(id => categoryMeta.find(c => c.id === id) || {id, gu:id, icon:'🌾'});
            const tabs = [{id:'ALL',gu:'બધા',icon:'🌾'}, ...dynamicCategories];
            if (els.categoryTabs) {
                els.categoryTabs.innerHTML = tabs.map(cat => {
                    const active = state.selectedCategory === cat.id;
                    const cls = active ? 'cat-pill selected' : 'cat-pill';
                    return `<button type="button" onclick="selectCropCategory('${cat.id}')" class="${cls}"><span>${cat.icon}</span><span>${cat.gu}</span></button>`;
                }).join('');
            }
            const search = (document.getElementById('cropSearchInput')?.value || '').trim().toLowerCase();
            let visible = state.selectedCategory === 'ALL' ? csvCrops : csvCrops.filter(c => c.category === state.selectedCategory);
            if (search) visible = visible.filter(c => c.gu.toLowerCase().includes(search) || c.commodity.toLowerCase().includes(search));
            if (!visible.length) {
                els.visualCropGrid.innerHTML = '<div class="crop-empty">પાક મળ્યો નથી. બીજું નામ લખો.</div>';

            els.visualCropGrid.innerHTML = visible.map(crop => {
                const active = state.filters.cropKeyword === crop.id;
                const cls = active ? 'crop-chip active' : 'crop-chip';
                const safe = JSON.stringify(crop.commodity).replace(/</g,'\\u003c');

            }).join('');

        function getDateDaysAgo(daysAgo) {
            const d = new Date();

        function formatDateDDMMYYYY(dateObj) {
            const dd = String(dateObj.getDate()).padStart(2, '0');
            const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
            const yyyy = dateObj.getFullYear();
            return `${dd}/${mm}/${yyyy}`;
        }

        function formatDateYYYYMMDD(dateObj) {
            const dd = String(dateObj.getDate()).padStart(2, '0');
            const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
            const yyyy = dateObj.getFullYear();
            return `${yyyy}-${mm}-${dd}`;
        }

        function isoToDDMMYYYY(isoStr) {
            if (!isoStr || !isoStr.includes('-')) return isoStr;
            const [y, m, d] = isoStr.split('-');
            return `${d}/${m}/${y}`;
        }

        function normalizeArrivalDate(rawDate) {
            if (!rawDate) return 'આજ';
            const str = String(rawDate).trim();
            if (/^\d{4}-\d{2}-\d{2}/.test(str)) {
                const [y, m, d] = str.slice(0, 10).split('-');
                return `${d}/${m}/${y}`;
            }
            return str;
        }

        function normalizeRecord(rec, index = 0) {
            const minP = parseFloat(rec.min_price ?? rec.Min_Price) || 0;
            const maxP = parseFloat(rec.max_price ?? rec.Max_Price) || 0;
            const modalP = parseFloat(rec.modal_price ?? rec.Modal_Price) || Math.round((minP + maxP) / 2);

            return {
                id: index + 1,
                state: String(rec.state ?? rec.State ?? 'Gujarat').trim(),
                district: String(rec.district ?? rec.District ?? 'Unknown').trim(),
                market: String(rec.market ?? rec.Market ?? 'Unknown').trim(),
                commodity: String(rec.commodity ?? rec.Commodity ?? 'Unknown').trim(),
                variety: String(rec.variety ?? rec.Variety ?? 'સામાન્ય').trim(),
                arrival_date: normalizeArrivalDate(rec.arrival_date ?? rec.Arrival_Date),
                min_price: minP,
                max_price: maxP,
                modal_price: modalP
            };
        }

        function buildMultiDayFallbackData(customCenterDate = null) {
            const baseTemplates = [
                { district: "Rajkot", market: "Gondal", commodity: "Groundnut", variety: "Bold (G-20)", min: 5200, max: 6650, modal: 6150 },
                { district: "Rajkot", market: "Rajkot", commodity: "Cotton", variety: "Shankar-6", min: 6900, max: 7850, modal: 7480 },
                { district: "Rajkot", market: "Jasdan", commodity: "Groundnut", variety: "G-20", min: 5150, max: 6500, modal: 6020 },
                { district: "Mehsana", market: "Unjha", commodity: "Cumin Seed(Jeera)", variety: "Eagle", min: 21500, max: 26200, modal: 24100 },
                { district: "Mehsana", market: "Unjha", commodity: "Fennel", variety: "Green", min: 8200, max: 11800, modal: 10200 },
                { district: "Bhavnagar", market: "Mahuva", commodity: "Onion", variety: "Red", min: 950, max: 2150, modal: 1620 },
                { district: "Banaskantha", market: "Deesa", commodity: "Potato", variety: "Pukhraj", min: 900, max: 1650, modal: 1320 },
                { district: "Junagadh", market: "Junagadh", commodity: "Wheat", variety: "Lokwan", min: 2450, max: 2980, modal: 2740 },
                { district: "Amreli", market: "Amreli", commodity: "Sesamum(Sesame,Gingelly,Til)", variety: "White", min: 10800, max: 13400, modal: 12250 },
                { district: "Jamnagar", market: "Jamnagar", commodity: "Coriander seed", variety: "Eagle", min: 6400, max: 7900, modal: 7250 },
                { district: "Banaskantha", market: "Palanpur", commodity: "Castor Seed", variety: "Hybrid", min: 5650, max: 6150, modal: 5940 },
                { district: "Ahmedabad", market: "Ahmedabad", commodity: "Tomato", variety: "Hybrid", min: 1100, max: 2400, modal: 1750 },
                { district: "Surat", market: "Surat", commodity: "Brinjal", variety: "Local", min: 1400, max: 2600, modal: 2050 },
                { district: "Anand", market: "Anand", commodity: "Banana", variety: "Robusta", min: 1200, max: 2100, modal: 1680 },
                { district: "Junagadh", market: "Junagadh", commodity: "Mango", variety: "Kesar", min: 4500, max: 8500, modal: 6400 },
                { district: "Rajkot", market: "Gondal", commodity: "Bengal Gram(Gram)(Whole)", variety: "Desi", min: 5400, max: 6250, modal: 5850 },
                { district: "Vadodara", market: "Vadodara", commodity: "Arhar (Tur/Red Gram)(Whole)", variety: "Red", min: 7600, max: 9100, modal: 8450 },
                { district: "Surat", market: "Surat", commodity: "Coriander(Leaves)", variety: "Green", min: 1800, max: 3200, modal: 2500 },
                { district: "Ahmedabad", market: "Ahmedabad", commodity: "Spinach", variety: "Fresh", min: 900, max: 1600, modal: 1250 },
                { district: "Kachchh", market: "Bhuj", commodity: "Bajra(Pearl Millet/Cumbu)", variety: "Desi", min: 2200, max: 2750, modal: 2480 }
            ];

            const generated = [];
            let idx = 1;
            const anchorDate = customCenterDate || new Date();
            const dayOffsets = customCenterDate ? [0] : [0, 1, 2, 3, 4, 5, 6];

            dayOffsets.forEach(daysAgo => {
                const d = new Date(anchorDate);
                d.setDate(d.getDate() - daysAgo);
                const dateStr = formatDateDDMMYYYY(d);
                const seedFactor = (d.getDate() + d.getMonth() * 3) % 7;

                baseTemplates.forEach((item, itemIdx) => {
                    const wave = Math.sin(seedFactor + itemIdx * 0.7) * 0.04;
                    const factor = 1 + wave;
                    generated.push({
                        id: idx++,
                        state: 'Gujarat',
                        district: item.district,
                        market: item.market,
                        commodity: item.commodity,
                        variety: item.variety,
                        arrival_date: dateStr,
                        min_price: Math.round((item.min * factor) / 10) * 10,
                        max_price: Math.round((item.max * factor) / 10) * 10,
                        modal_price: Math.round((item.modal * factor) / 10) * 10
                    });
                });
            });
            return generated;
        }

            else if (state.activeMode === 'two_days_ago') dateTxt = `૨ દિવસ પહેલા (${formatDateDDMMYYYY(getDateDaysAgo(2))})`;
            else if (state.activeMode === 'specific_date') dateTxt = `તારીખ ${isoToDDMMYYYY(els.specificDateInput.value)}`;
            if (els.activeDateSubtitle) {
                els.activeDateSubtitle.textContent = `${dateTxt} • ${unitTxt}`;
            }

        function showBanner(title, message) {
            els.alertTitle.textContent = title;
            els.alertMessage.textContent = message;
            els.alertBanner.classList.remove('hidden');
        }

        function hideBanner() {
            els.alertBanner.classList.add('hidden');

        async function fetchHistoricalByDate(ddmmyyyy, yyyymmdd) {
            const buildHistUrl = (dateVal) => {
                const u = new URL(HISTORICAL_API_BASE);
                u.searchParams.set('api-key', DEFAULT_API_KEY);
                u.searchParams.set('format', 'json');
                u.searchParams.set('limit', '1000');
                u.searchParams.set('filters[State]', 'Gujarat');
                u.searchParams.set('filters[Arrival_Date]', dateVal);
                return u.toString();
            };

            try {
                const res1 = await fetch(buildHistUrl(ddmmyyyy));
                if (res1.ok) {
                    const data1 = await res1.json();
                    if (Array.isArray(data1.records) && data1.records.length > 0) return data1.records;
                }
            } catch (e) {}

            try {
                const res2 = await fetch(buildHistUrl(yyyymmdd));
                if (res2.ok) {
                    const data2 = await res2.json();
                    if (Array.isArray(data2.records) && data2.records.length > 0) return data2.records;
                }
            } catch (e) {}

            try {
                const liveCheckUrl = new URL(LIVE_API_BASE);
                liveCheckUrl.searchParams.set('api-key', DEFAULT_API_KEY);
                liveCheckUrl.searchParams.set('format', 'json');
                liveCheckUrl.searchParams.set('limit', '1500');
                liveCheckUrl.searchParams.set('filters[state]', 'Gujarat');
                const resLive = await fetch(liveCheckUrl.toString());
                if (resLive.ok) {
                    const dataLive = await resLive.json();
                    if (Array.isArray(dataLive.records)) {
                        const matched = dataLive.records.filter(r => {
                            const ad = normalizeArrivalDate(r.arrival_date ?? r.Arrival_Date);
                            return ad === ddmmyyyy;
                        });
                        if (matched.length > 0) return matched;
                    }
                }
            } catch (e) {}

            return [];
        }

        async function loadMandiData(mode = 'live', customIsoDate = null) {
            setDatePillActive(mode);
            els.refreshIcon.classList.add('animate-spin');
            els.loadingState.classList.remove('hidden');
            els.dashboardContent.classList.add('hidden');
            hideBanner();

            let targetDateObj = new Date();
            if (mode === 'yesterday') targetDateObj = getDateDaysAgo(1);
            else if (mode === 'two_days_ago') targetDateObj = getDateDaysAgo(2);
            else if (mode === 'specific_date' && customIsoDate) {
                const [y, m, d] = customIsoDate.split('-').map(Number);
                targetDateObj = new Date(y, m - 1, d);
            }

            if (els.specificDateInput && mode !== 'specific_date') {
                els.specificDateInput.value = formatDateYYYYMMDD(targetDateObj);
            }
            updateDateSubtitle();

            try {
                let fetchedRecords = [];

                if (mode === 'live') {
                    const liveUrl = new URL(LIVE_API_BASE);
                    liveUrl.searchParams.set('api-key', DEFAULT_API_KEY);
                    liveUrl.searchParams.set('format', 'json');
                    liveUrl.searchParams.set('limit', '2000');
                    liveUrl.searchParams.set('offset', '0');
                    liveUrl.searchParams.set('filters[state]', 'Gujarat');

                    const response = await fetch(liveUrl.toString());
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const data = await response.json();
                    if (Array.isArray(data.records)) fetchedRecords = data.records;
                } else {
                    const ddmmyyyy = formatDateDDMMYYYY(targetDateObj);
                    const yyyymmdd = formatDateYYYYMMDD(targetDateObj);
                    fetchedRecords = await fetchHistoricalByDate(ddmmyyyy, yyyymmdd);
                }

                if (!fetchedRecords || fetchedRecords.length === 0) {
                    throw new Error('NO_RECORDS_FOR_DATE');
                }

                state.rawRecords = fetchedRecords.map((r, i) => normalizeRecord(r, i));

                els.dataStatusBadge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-[#34C759] animate-pulse"></span> તાજો`;
                els.dataStatusBadge.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-bold bg-[#E8F8ED] text-[#1E7E34] shrink-0';

            } catch (err) {
                const fallbackAll = buildMultiDayFallbackData(mode === 'live' ? null : targetDateObj);
                const targetStr = formatDateDDMMYYYY(targetDateObj);
                const exactDay = fallbackAll.filter(r => r.arrival_date === targetStr);
                state.rawRecords = exactDay.length ? exactDay : fallbackAll.filter(r => r.arrival_date === fallbackAll[0].arrival_date);

                els.dataStatusBadge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span> અંદાજિત`;
                els.dataStatusBadge.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-bold bg-amber-50 text-amber-800 shrink-0';

                showBanner('નોંધ:', `${formatDateDDMMYYYY(targetDateObj)} ના સરકારી ભાવ હજુ અપલોડ થયા નથી, તેથી અંદાજિત ભાવ બતાવ્યા છે.`);
            } finally {
                els.refreshIcon.classList.remove('animate-spin');
                els.loadingState.classList.add('hidden');
                els.dashboardContent.classList.remove('hidden');

                populateFilterDropdowns();
                applyFiltersAndRender();
                if (state.uiViewMode === 'khetigram') renderKhetiGramView();
            }
        }

        function populateFilterDropdowns() {
            const districts = [...new Set(state.rawRecords.map(r => r.district))].sort();
            els.districtFilter.innerHTML = '<option value="">📍 બધા જિલ્લા</option>' +
                districts.map(d => `<option value="${d}" ${state.filters.district === d ? 'selected' : ''}>${getGujaratiName(d)}</option>`).join('');

            updateCascadingDropdowns();
        }

        function updateCascadingDropdowns() {
            const dist = state.filters.district;
            const subset = dist ? state.rawRecords.filter(r => r.district === dist) : state.rawRecords;

            const markets = [...new Set(subset.map(r => r.market))].sort();
            els.marketFilter.innerHTML = '<option value="">🏛️ બધા માર્કેટ યાર્ડ</option>' +
                markets.map(m => `<option value="${m}" ${state.filters.market === m ? 'selected' : ''}>${getGujaratiName(m)}</option>`).join('');
        }

        function applyFiltersAndRender() {
            const csvCropSelected = String(state.filters.cropKeyword || '').startsWith('CSV:');
            const selectedCommodity = csvCropSelected ? String(state.filters.cropKeyword).slice(4) : '';
            const cropObj = CROP_DICTIONARY.find(c => c.id === state.filters.cropKeyword);
            const activeCategory = state.selectedCategory;

            const hasActiveFilters = Boolean(cropObj || activeCategory !== 'ALL' || state.filters.district || state.filters.market);
            if (els.resetFiltersBtn) {
                els.resetFiltersBtn.classList.toggle('hidden', !hasActiveFilters);
            }
            if (els.activeFilterDot) {
                els.activeFilterDot.classList.toggle('hidden', !(state.filters.district || state.filters.market));
            }

            state.filteredRecords = state.rawRecords.filter(rec => {
                if (state.filters.district && rec.district !== state.filters.district) return false;
                if (state.filters.market && rec.market !== state.filters.market) return false;

                const commLower = rec.commodity.toLowerCase();

                if (csvCropSelected) {
                    if (rec.commodity !== selectedCommodity) return false;
                } else if (cropObj) {
                    if (!cropObj.keywords.some(k => commLower.includes(k))) return false;
                } else if (activeCategory !== 'ALL') {
                    const csvCrops = getCsvCropList().filter(c => c.category === activeCategory);
                    if (!csvCrops.some(c => c.commodity === rec.commodity)) return false;
                }

                return true;
            });

            const dir = state.sortDirection === 'asc' ? 1 : -1;
            state.filteredRecords.sort((a, b) => {
                const valA = a[state.sortKey];
                const valB = b[state.sortKey];
                if (typeof valA === 'number' && typeof valB === 'number') return (valA - valB) * dir;
                return String(valA).localeCompare(String(valB)) * dir;
            });

            renderCards();
        }

        function renderPagination(totalPages) {
            if (totalPages <= 1) {
                els.paginationControls.innerHTML = `<span class="text-xs font-bold text-[#6E6E73]">પાનું ૧ / ૧</span>`;
                return;
            }
            const prevDisabled = state.currentPage === 1 ? 'opacity-40 pointer-events-none' : '';
            const nextDisabled = state.currentPage === totalPages ? 'opacity-40 pointer-events-none' : '';

            els.paginationControls.innerHTML = `
                <button onclick="goToPage(${state.currentPage - 1})" class="px-3.5 py-1.5 text-xs font-extrabold rounded-full bg-[#F5F5F7] text-[#1D1D1F] ${prevDisabled}">‹ પાછળ</button>
                <span class="text-xs font-extrabold text-[#1D1D1F] px-1">${state.currentPage} / ${totalPages}</span>
                <button onclick="goToPage(${state.currentPage + 1})" class="px-3.5 py-1.5 text-xs font-extrabold rounded-full bg-[#1D1D1F] text-white ${nextDisabled}">આગળ ›</button>
            `;
        }

        window.goToPage = function(page) {

        function toggleFavoriteYard(marketName) {
            const idx = state.favoriteYards.indexOf(marketName);
            if (idx >= 0) state.favoriteYards.splice(idx, 1);
            else state.favoriteYards.push(marketName);
            localStorage.setItem('guj_mandi_fav_yards', JSON.stringify(state.favoriteYards));

            state.kgSelectedYard = marketName;

            e.stopPropagation();

        };

        function renderKhetiGramView() {
            const searchQ = (els.kgSearchInput?.value || '').trim().toLowerCase();

            document.querySelectorAll('.kg-region-pill').forEach(btn => {
                const isActive = btn.dataset.region === state.kgRegion;
                btn.className = isActive

                    : 'kg-region-pill shrink-0 px-3.5 py-1.5 rounded-full text-xs font-bold bg-[#F5F5F7] text-[#1D1D1F]';

            if (state.kgSelectedYard) {
                els.kgYardDirectoryScreen.classList.add('hidden');
                els.kgYardDetailScreen.classList.remove('hidden');
                els.kgBackToYardsBtn.classList.remove('hidden');

                const yardRecords = state.rawRecords.filter(r => r.market === state.kgSelectedYard);
                const firstRec = yardRecords[0] || { market: state.kgSelectedYard, district: 'Gujarat', arrival_date: '' };
                const isFav = state.favoriteYards.includes(state.kgSelectedYard);

                els.kgSelectedYardTitle.textContent = `${getGujaratiName(firstRec.market)} માર્કેટ યાર્ડ`;

                els.kgToggleFavDetailBtn.textContent = isFav ? '⭐' : '☆';

                els.kgYardRatesTbody.innerHTML = yardRecords.map(r => `
                    <tr class="hover:bg-[#F5F5F7]/60">
                        <td class="py-3 px-4">
                            <div class="flex items-center gap-2">
                                <span class="text-xl">${getCropIcon(r.commodity)}</span>
                                <span class="font-extrabold text-[#1D1D1F] text-sm">${getGujaratiName(r.commodity)}</span>
                            </div>

                        <td class="py-3 px-2 text-right font-black text-[#1D1D1F] text-base">₹${formatPrice(r.modal_price)}</td>
                        <td class="py-3 px-4 text-right font-extrabold text-[#248A3D]">₹${formatPrice(r.max_price)}</td>
                    </tr>
                `).join('');
                return;
            }

            els.kgYardDirectoryScreen.classList.remove('hidden');
            els.kgYardDetailScreen.classList.add('hidden');
            els.kgBackToYardsBtn.classList.add('hidden');

            const yardMap = new Map();
            state.rawRecords.forEach(r => {
                if (!yardMap.has(r.market)) {
                    yardMap.set(r.market, {
                        market: r.market,
                        district: r.district,
                        region: getMarketRegion(r.district),
                        commodities: new Set()
                    });

                yardMap.get(r.market).commodities.add(r.commodity);
            });

            let yards = Array.from(yardMap.values()).filter(y => {

                if (state.kgRegion !== 'ALL' && state.kgRegion !== 'FAV' && y.region !== state.kgRegion) return false;

                    }

                return true;
            });

            yards.sort((a, b) => {
                const aFav = state.favoriteYards.includes(a.market) ? 0 : 1;

                if (aFav !== bFav) return aFav - bFav;
                return a.market.localeCompare(b.market);
            });

            if (yards.length === 0) {

                            </div>

                        <div class="flex items-center gap-2 shrink-0">

                            </button>
                            <span class="text-[#86868B] font-bold text-xl">›</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

                    state.currentPage = 1;
                    updateCascadingDropdowns();
                    applyFiltersAndRender();
                });
            }

            if (els.marketFilter) {
                els.marketFilter.addEventListener('change', () => {
                    state.filters.market = els.marketFilter.value;
                    state.currentPage = 1;
                    applyFiltersAndRender();
                });
            }

            if (els.resetFiltersBtn) {
                els.resetFiltersBtn.addEventListener('click', () => {
                    state.selectedCategory = 'ALL';
                    state.filters = { district: '', market: '', cropKeyword: '' };
                    state.currentPage = 1;
                    populateFilterDropdowns();
                    renderVisualCropButtons();
                    applyFiltersAndRender();
                });
            }

            if (els.simpleSortSelect) {
                els.simpleSortSelect.addEventListener('change', () => {
                    const val = els.simpleSortSelect.value;
                    if (val === 'modal_desc') { state.sortKey = 'modal_price'; state.sortDirection = 'desc'; }
                    else if (val === 'modal_asc') { state.sortKey = 'modal_price'; state.sortDirection = 'asc'; }
                    else if (val === 'market_asc') { state.sortKey = 'market'; state.sortDirection = 'asc'; }
                    state.currentPage = 1;
                    applyFiltersAndRender();
                });
            }

            if (els.refreshDataBtn) {
                els.refreshDataBtn.addEventListener('click', () => {
                    loadMandiData(state.activeMode, els.specificDateInput?.value || null);
                });
            }

            if (els.kgSearchInput) els.kgSearchInput.addEventListener('input', renderKhetiGramView);
            document.querySelectorAll('.kg-region-pill').forEach(btn => {
                btn.addEventListener('click', () => {
                    state.kgRegion = btn.dataset.region;
                    state.kgSelectedYard = null;
                    renderKhetiGramView();
                });
            });

            const closeYardDetail = () => { state.kgSelectedYard = null; renderKhetiGramView(); };
            if (els.kgBackToYardsBtn) els.kgBackToYardsBtn.addEventListener('click', closeYardDetail);
            if (els.kgBottomBackBtn) els.kgBottomBackBtn.addEventListener('click', closeYardDetail);

            if (els.kgToggleFavDetailBtn) {
                els.kgToggleFavDetailBtn.addEventListener('click', () => {
                    if (state.kgSelectedYard) toggleFavoriteYard(state.kgSelectedYard);
                });
            }

            if (els.kgSpeakYardBtn) {
                els.kgSpeakYardBtn.addEventListener('click', () => {
                    if (!state.kgSelectedYard) return;
                    const yardRecs = state.rawRecords.filter(r => r.market === state.kgSelectedYard).slice(0, 4);
                    const unitTxt = state.priceUnit === 'mann' ? '૨૦ કિલોના' : '૧૦૦ કિલોના';
                    const details = yardRecs.map(r => `${getGujaratiName(r.commodity)} ${rawConvertedPrice(r.modal_price)} રૂપિયા`).join(', ');
                    speakGujarati(`${getGujaratiName(state.kgSelectedYard)} માર્કેટ યાર્ડના ${unitTxt} ભાવ: ${details}`);
                });
            }

            if (els.kgShareWhatsAppBtn) {
                els.kgShareWhatsAppBtn.addEventListener('click', () => {
                    if (!state.kgSelectedYard) return;
                    const yardRecs = state.rawRecords.filter(r => r.market === state.kgSelectedYard);
                    const unitTxt = state.priceUnit === 'mann' ? '૨૦ કિલો (મણ)' : '૧૦૦ કિલો';
                    const lines = yardRecs.map(r => `• ${getGujaratiName(r.commodity)}: ₹${formatPrice(r.min_price)} થી ₹${formatPrice(r.max_price)}`).join('\n');
                    const shareText = `🌾 *${getGujaratiName(state.kgSelectedYard)} માર્કેટ યાર્ડ ભાવ* (${unitTxt})\n\n${lines}`;
                    window.open(`https://wa.me/?text=${encodeURIComponent(shareText)}`, '_blank');
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderVisualCropButtons();
            initEventListeners();
            loadMandiData('live');
        });
    </script>\n</body>\n</html>
