name: Refresh Khetigram graph cache

on:
  schedule:
    - cron: "30 3,9,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Refresh cache from data.gov.in
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: python scripts/update_graph_cache.py
      - name: Commit updated cache if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/graph-cache.json
          if git diff --cached --quiet; then
            echo "Cache unchanged; no commit needed."
          else
            git commit -m "Refresh graph price cache"
            git push
          fi
